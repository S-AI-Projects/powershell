# Track-specific test rationales:
# - "robot has a name": Validates format regex ^[A-Z]{2}\d{3}$ on initial instance creation.
# - "name is the same each time": Asserts getter idempotency ($robot.Name does not regenerate on read).
# - "different robot has different name": Tests that subsequent [Robot]::new() calls produce distinct names.
# - "name can be reset": Asserts calling $robot.Reset() alters the instance name.
# - "name is valid after many reset": 100 iterations of Reset() preserving format and name transitions.
# - "robot name are unique": 1000 robot names inserted into a .NET HashSet to verify collision resistance.
